spring.application.name=messager
server.port=8083

TWILI0_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:}
TWILI0_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:}
TWILI0_OUTGOING_SMS_NUMBER=${TWILIO_PHONE_NUMBER:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.datasource.url = jdbc:mysql://localhost:3306/emp3
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
